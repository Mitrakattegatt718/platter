[package]
name = "platter-tauri"
version = "0.1.0"
description = "Platter — iPod library manager"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "platter_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
base64 = "0.22"
libc = "0.2"
# Cue sheets from RuTracker-style rips are often cp1251; std can't decode it.
encoding_rs = "0.8"

# Swapping the Dock icon needs AppKit directly — Tauri 2 exposes no app-icon
# setter (there is no `applicationIconImage` anywhere in tauri or
# tauri-runtime-wry). objc2-app-kit is already in the tree via wry, which
# enables NSApplication and NSResponder; NSImage is the only feature this adds.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "NSApplication",
  "NSResponder",
  "NSImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData"] }

# The app is IPC + FFI bound; fat LTO with one codegen unit buys both size and
# cross-crate inlining on the serde snapshot path. Nothing here relies on
# unwinding (no catch_unwind; the C bridge never unwinds), so abort is safe.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# Dependencies are compiled once and then cached, so optimizing them costs
# nothing on the edit loop while making debug builds usable on the paths that
# actually do work — tag parsing, serde over a full snapshot, the convert
# pipeline. Own-crate code stays at opt-level 0 so rebuilds stay fast.
[profile.dev.package."*"]
opt-level = 2

# Full debuginfo across ~440 crates is most of a multi-gigabyte target dir, and
# line tables are all that backtraces need.
[profile.dev]
debug = "line-tables-only"
